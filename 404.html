<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Advayacare</title>
    <script>
      (function () {
        const segmentCount = 0;
        const locationPath = window.location.pathname;
        const redirectPath = locationPath
          .split("/")
          .slice(1 + segmentCount)
          .join("/")
          .replace(/&/g, "~and~");
        const search = window.location.search ? "&" + window.location.search.slice(1).replace(/&/g, "~and~") : "";
        const hash = window.location.hash || "";

        const newUrl =
          window.location.protocol +
          "//" +
          window.location.hostname +
          (window.location.port ? ":" + window.location.port : "") +
          window.location.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          redirectPath +
          search +
          hash;

        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
